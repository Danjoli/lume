name: Sugerir uma melhoria
description: Proponha uma funcionalidade ou melhoria para a livraria.
title: "[Melhoria]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema ou oportunidade
      description: Qual necessidade esta proposta atende?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Solução proposta
      description: Descreva o resultado desejado.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceitação
      placeholder: |
        - [ ] Critério 1
        - [ ] Critério 2
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - Loja pública
        - Catálogo
        - Carrinho e pedidos
        - Painel administrativo
        - Pagamentos
        - Frete
        - Segurança
        - Infraestrutura e qualidade
        - Documentação
    validations:
      required: true
