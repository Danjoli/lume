name: Relatar um problema
description: Registre um comportamento incorreto ou inesperado.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Obrigado por ajudar a melhorar o Lume.
  - type: textarea
    id: description
    attributes:
      label: Descrição
      description: Explique claramente o problema encontrado.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Acesse...
        2. Clique em...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidências e contexto
      description: Inclua erros, capturas e informações do ambiente, sem dados sensíveis.
  - type: checkboxes
    id: checks
    attributes:
      label: Verificações
      options:
        - label: Confirmei que não existe outra Issue aberta para o mesmo problema.
          required: true
        - label: Removi senhas, tokens e dados pessoais das evidências.
          required: true
